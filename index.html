<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Staff Scheduler Live</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#182230;--muted:#667085;--line:#dce1e8;--brand:#1d4ed8;--good:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box} body{margin:0;font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit} button{cursor:pointer}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top h1{font-size:18px;margin:0 12px 0 0}.btn{border:1px solid #cfd6df;background:#fff;color:#111827;border-radius:8px;padding:8px 10px}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:#fff;background:var(--bad);border-color:var(--bad)}.btn.small{padding:5px 7px;font-size:12px}.status{margin-left:auto;font-weight:700}.status.live{color:#86efac}.status.off{color:#fca5a5}
.toolbar{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.week-title{font-weight:800;font-size:16px;min-width:230px;text-align:center}.layout{display:grid;grid-template-columns:290px 1fr;gap:12px;padding:0 12px 16px}.side{display:flex;flex-direction:column;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel-head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.panel-head h2{margin:0;font-size:14px}.search{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}.group{border-top:1px solid var(--line)}.group-title{padding:8px 10px;background:#f8fafc;font-weight:800;display:flex;justify-content:space-between;align-items:center}.person,.vehicle{margin:6px 8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;gap:8px;align-items:center}.person[draggable=true],.vehicle[draggable=true]{cursor:grab}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e}.dot.leave{background:#f59e0b}.dot.sick{background:#ef4444}.empty{padding:10px;color:var(--muted);font-style:italic}
.board{display:grid;grid-template-columns:repeat(7,minmax(220px,1fr));gap:10px;overflow-x:auto}.day{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:520px;display:flex;flex-direction:column}.day-head{padding:10px;border-bottom:1px solid var(--line);position:sticky;top:61px;background:#fff;z-index:5}.day-name{font-weight:900}.day-date{color:var(--muted);font-size:12px}.inline-add{display:flex;gap:5px;margin-top:8px}.inline-add input{min-width:0;flex:1;padding:7px;border:1px solid var(--line);border-radius:7px}.jobs{padding:8px;min-height:400px}.job{border:1px solid #cbd5e1;border-left:6px solid var(--job,#2563eb);border-radius:10px;background:#fff;margin-bottom:8px;box-shadow:0 1px 2px #0000000d}.job.dragging{opacity:.4}.job-head{padding:8px;display:flex;gap:6px;align-items:flex-start}.job-title{font-weight:900;flex:1}.job-meta{font-size:12px;color:var(--muted);padding:0 8px 8px}.dropzone{margin:0 8px 8px;border:1px dashed #b7c0cc;border-radius:8px;padding:6px;min-height:39px}.dropzone.over{background:#eff6ff;border-color:#2563eb}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:4px 7px;background:#eef2ff;font-size:12px}.chip.vehicle-chip{background:#ecfdf3}.chip button{border:0;background:transparent;padding:0;color:#475467}.label{font-size:11px;font-weight:800;color:#667085;margin-bottom:4px}.drop-hint{font-size:11px;color:#98a2b3}.day.over{outline:2px solid #2563eb}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.modal.open{display:flex}.dialog{background:#fff;border-radius:14px;width:min(720px,100%);max-height:90vh;overflow:auto}.dialog h3{margin:0}.dialog-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialog-body{padding:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}.field label{display:block;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}.rows{display:flex;flex-direction:column;gap:8px}.row{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:center}.row input,.row select{padding:8px;border:1px solid var(--line);border-radius:8px}.dialog-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:10px 12px;border-radius:8px;display:none;z-index:80}.toast.show{display:block}@media(max-width:1050px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(7,260px)}}@media(max-width:650px){.side{grid-template-columns:1fr}.toolbar{padding:10px}.layout{padding:0 8px 12px}.top{position:static}.day-head{top:0}.form-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.status{margin-left:0;width:100%}}@media print{.top,.toolbar,.side,.inline-add,.job-head button{display:none!important}.layout{display:block}.board{display:grid;grid-template-columns:repeat(2,1fr);overflow:visible}.day{min-height:auto;break-inside:avoid}.dropzone{border:0;padding:0}.drop-hint{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><h1>Staff Scheduler Live</h1><button class="btn" id="manageStaff">Manage Staff</button><button class="btn" id="manageVehicles">Manage Vehicles</button><button class="btn" id="backupBtn">Backup</button><button class="btn" id="restoreBtn">Restore</button><button class="btn" onclick="window.print()">Print</button><span id="status" class="status off">Connecting…</span></header>
  <div class="toolbar"><button class="btn" id="prevWeek">← Previous</button><button class="btn" id="todayWeek">This Week</button><button class="btn" id="nextWeek">Next →</button><div class="week-title" id="weekTitle"></div><button class="btn" id="copyPrev">Copy Previous Week</button><button class="btn" id="undoBtn">Undo</button><button class="btn" id="redoBtn">Redo</button></div>
  <main class="layout">
    <aside class="side">
      <section class="panel"><div class="panel-head"><h2>Staff</h2></div><div style="padding:10px"><input id="staffSearch" class="search" placeholder="Search staff"><select id="statusFilter" class="search" style="margin-top:7px"><option value="">All statuses</option><option>Available</option><option>On Leave</option><option>Sick</option></select></div><div id="staffList"></div></section>
      <section class="panel"><div class="panel-head"><h2>Vehicles</h2></div><div style="padding:10px"><input id="vehicleSearch" class="search" placeholder="Search vehicles"></div><div id="vehicleList"></div></section>
    </aside>
    <section class="board" id="board"></section>
  </main>
</div>
<div class="modal" id="jobModal"><div class="dialog"><div class="dialog-head"><h3>Edit Job</h3><button class="btn small" data-close>✕</button></div><div class="dialog-body"><div class="form-grid"><div class="field full"><label>Job name</label><input id="jobName"></div><div class="field"><label>Address</label><input id="jobAddress"></div><div class="field"><label>Colour</label><input id="jobColor" type="color" value="#2563eb"></div><div class="field full"><label>Notes</label><textarea id="jobNotes" rows="4"></textarea></div></div></div><div class="dialog-foot"><button class="btn danger" id="deleteJob">Delete</button><button class="btn" data-close>Cancel</button><button class="btn primary" id="saveJob">Save</button></div></div></div>
<div class="modal" id="staffModal"><div class="dialog"><div class="dialog-head"><h3>Manage Staff</h3><button class="btn small" data-close>✕</button></div><div class="dialog-body"><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" id="addStaff">+ Add Staff</button><button class="btn" id="addStaffCategory">+ Add Category</button></div><div id="staffRows" class="rows"></div></div><div class="dialog-foot"><button class="btn" data-close>Close</button><button class="btn primary" id="saveStaff">Save Changes</button></div></div></div>
<div class="modal" id="vehicleModal"><div class="dialog"><div class="dialog-head"><h3>Manage Vehicles</h3><button class="btn small" data-close>✕</button></div><div class="dialog-body"><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" id="addVehicle">+ Add Vehicle</button><button class="btn" id="addVehicleCategory">+ Add Category</button></div><div id="vehicleRows" class="rows"></div></div><div class="dialog-foot"><button class="btn" data-close>Close</button><button class="btn primary" id="saveVehicles">Save Changes</button></div></div></div>
<input type="file" id="restoreFile" accept="application/json" hidden><div class="toast" id="toast"></div>
<script>
const API='/.netlify/functions/schedule', DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const ids=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2)+Date.now();
const initialStaff=['BEN GARDNER','JIALANG GU','ANDY TABAR','MARK BANICO','GLENN OULD','FRANCIS TRONG LUAT HO','SIMON LANG','Borko Mitrovic','Vedran Zoraja','Martin Quan','RYAN HAYWOOD','JUAN GIRALDOPA','WINSTON PHAM','JUSTIN PHAM','MARIO MOTTA','OZGUR OZTURK','WENCESLAO PATRITIO','KILIN HATTORI','JACK NEWMAN','CAOLAN ROONEY','BRANDON LE','COLIN HUGHES','BEN DEWSE','DAEWON HONG','LUKE RAYNOR','BRAINER VENEGAS','CRISTIAN CHAVARRIAGA','KINGROY SUSON'];
const defaults=()=>({version:1,staffCategories:[{id:'fulltime',name:'FULL TIME - WORKSTATION'},{id:'casual',name:'CASUAL'}],vehicleCategories:[{id:'vehicles',name:'VEHICLES'}],staff:initialStaff.map((name,i)=>({id:ids(),name,categoryId:i<7?'fulltime':'casual',status:'Available'})),vehicles:[],weeks:{},updatedAt:new Date().toISOString()});
let state=loadLocal()||defaults(), weekStart=getMonday(new Date()), selectedJob=null, history=[], future=[], saveTimer=null, lastServerStamp='';
function getMonday(d){d=new Date(d);d.setHours(0,0,0,0);const n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d}
function key(){return weekStart.toISOString().slice(0,10)}
function week(){return state.weeks[key()]||(state.weeks[key()]={jobs:[]})}
function dateFor(i){const d=new Date(weekStart);d.setDate(d.getDate()+i);return d}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function snapshot(){history.push(JSON.stringify(state));if(history.length>40)history.shift();future=[]}
function mutate(fn){snapshot();fn();state.updatedAt=new Date().toISOString();saveLocal();scheduleSave();render()}
function saveLocal(){localStorage.setItem('staffSchedulerLiveV1',JSON.stringify(state))}
function loadLocal(){try{return JSON.parse(localStorage.getItem('staffSchedulerLiveV1'))}catch{return null}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveOnline,500)}
async function saveOnline(){try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({data:state})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Save failed');lastServerStamp=j.updatedAt||'';setStatus(true,'Live · saved online')}catch(e){setStatus(false,'Offline · saved locally')}}
async function pullOnline(initial=false){try{const r=await fetch(API,{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error();setStatus(true,'Live · saved online');if(j.data){const stamp=j.data.serverUpdatedAt||j.data.updatedAt||'';if(initial||(!saveTimer&&stamp&&stamp!==lastServerStamp&&new Date(stamp)>new Date(state.serverUpdatedAt||state.updatedAt||0))){state=j.data;lastServerStamp=stamp;saveLocal();render()}}else if(initial){await saveOnline()}}catch{setStatus(false,'Offline · saved locally')}}
function setStatus(ok,text){const e=document.getElementById('status');e.textContent=text;e.className='status '+(ok?'live':'off')}
function render(){renderWeekTitle();renderStaff();renderVehicles();renderBoard()}
function renderWeekTitle(){const end=new Date(weekStart);end.setDate(end.getDate()+6);document.getElementById('weekTitle').textContent=`${weekStart.toLocaleDateString('en-AU',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}`}
function renderStaff(){const q=document.getElementById('staffSearch').value.toLowerCase(),f=document.getElementById('statusFilter').value;document.getElementById('staffList').innerHTML=state.staffCategories.map(c=>{const items=state.staff.filter(x=>x.categoryId===c.id&&x.name.toLowerCase().includes(q)&&(!f||x.status===f));return `<div class="group" data-staff-cat="${c.id}"><div class="group-title">${esc(c.name)}<span>${items.length}</span></div>${items.length?items.map(x=>`<div class="person" draggable="true" data-type="staff" data-id="${x.id}"><span class="dot ${x.status==='On Leave'?'leave':x.status==='Sick'?'sick':''}"></span><span>${esc(x.name)}</span><small style="margin-left:auto;color:#667085">${esc(x.status)}</small></div>`).join(''):'<div class="empty">No staff</div>'}</div>`}).join('');bindDragSources();bindCategoryDrops()}
function renderVehicles(){const q=document.getElementById('vehicleSearch').value.toLowerCase();document.getElementById('vehicleList').innerHTML=state.vehicleCategories.map(c=>{const items=state.vehicles.filter(x=>x.categoryId===c.id&&x.name.toLowerCase().includes(q));return `<div class="group" data-vehicle-cat="${c.id}"><div class="group-title">${esc(c.name)}<span>${items.length}</span></div>${items.length?items.map(x=>`<div class="vehicle" draggable="true" data-type="vehicle" data-id="${x.id}"><span>🚐</span><span>${esc(x.name)}</span></div>`).join(''):'<div class="empty">No vehicles</div>'}</div>`}).join('');bindDragSources();bindCategoryDrops()}
function renderBoard(){document.getElementById('board').innerHTML=DAYS.map((day,i)=>{const d=dateFor(i),jobs=week().jobs.filter(j=>j.day===i).sort((a,b)=>(a.order||0)-(b.order||0));return `<section class="day" data-day="${i}"><div class="day-head"><div class="day-name">${day}</div><div class="day-date">${d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</div><div class="inline-add"><input data-add-job="${i}" placeholder="Add job to ${day}"><button class="btn primary small" data-add-btn="${i}">+</button></div></div><div class="jobs">${jobs.map(jobCard).join('')}</div></section>`}).join('');bindBoard()}
function jobCard(j){const people=(j.staffIds||[]).map(id=>state.staff.find(x=>x.id===id)).filter(Boolean),vehicles=(j.vehicleIds||[]).map(id=>state.vehicles.find(x=>x.id===id)).filter(Boolean);return `<article class="job" draggable="true" data-job="${j.id}" style="--job:${j.color||'#2563eb'}"><div class="job-head"><div class="job-title">${esc(j.name)}</div><button class="btn small" data-edit-job="${j.id}">✎</button></div>${j.address||j.notes?`<div class="job-meta">${j.address?`📍 ${esc(j.address)}<br>`:''}${j.notes?esc(j.notes):''}</div>`:''}<div class="dropzone" data-drop="staff" data-jobid="${j.id}"><div class="label">STAFF</div><div class="chips">${people.map(p=>`<span class="chip">${esc(p.name)}<button data-remove-staff="${p.id}" data-jobid="${j.id}">×</button></span>`).join('')}</div>${people.length?'':'<div class="drop-hint">Drag staff here</div>'}</div><div class="dropzone" data-drop="vehicle" data-jobid="${j.id}"><div class="label">VEHICLES</div><div class="chips">${vehicles.map(v=>`<span class="chip vehicle-chip">${esc(v.name)}<button data-remove-vehicle="${v.id}" data-jobid="${j.id}">×</button></span>`).join('')}</div>${vehicles.length?'':'<div class="drop-hint">Drag vehicles here</div>'}</div></article>`}
function bindDragSources(){document.querySelectorAll('[draggable=true][data-type]').forEach(el=>el.ondragstart=e=>{e.dataTransfer.setData('text/plain',JSON.stringify({type:el.dataset.type,id:el.dataset.id}))})}
function bindCategoryDrops(){document.querySelectorAll('[data-staff-cat]').forEach(el=>{el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const d=parseDrag(e);if(d?.type==='staff')mutate(()=>{const x=state.staff.find(s=>s.id===d.id);if(x)x.categoryId=el.dataset.staffCat})}});document.querySelectorAll('[data-vehicle-cat]').forEach(el=>{el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const d=parseDrag(e);if(d?.type==='vehicle')mutate(()=>{const x=state.vehicles.find(s=>s.id===d.id);if(x)x.categoryId=el.dataset.vehicleCat})}})}
function parseDrag(e){try{return JSON.parse(e.dataTransfer.getData('text/plain'))}catch{return null}}
function bindBoard(){document.querySelectorAll('[data-add-job]').forEach(inp=>inp.onkeydown=e=>{if(e.key==='Enter')addInline(+inp.dataset.addJob,inp)});document.querySelectorAll('[data-add-btn]').forEach(btn=>btn.onclick=()=>addInline(+btn.dataset.addBtn,document.querySelector(`[data-add-job="${btn.dataset.addBtn}"]`)));document.querySelectorAll('[data-edit-job]').forEach(b=>b.onclick=()=>openJob(b.dataset.editJob));document.querySelectorAll('.job').forEach(el=>{el.ondragstart=e=>{if(e.target.closest('button'))return;e.dataTransfer.setData('text/plain',JSON.stringify({type:'job',id:el.dataset.job}));el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging')});document.querySelectorAll('.day').forEach(day=>{day.ondragover=e=>e.preventDefault();day.ondrop=e=>{if(e.target.closest('.dropzone'))return;const d=parseDrag(e);if(d?.type==='job')mutate(()=>{const j=week().jobs.find(x=>x.id===d.id);if(j)j.day=+day.dataset.day})}});document.querySelectorAll('.dropzone').forEach(z=>{z.ondragover=e=>{e.preventDefault();e.stopPropagation();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();e.stopPropagation();z.classList.remove('over');const d=parseDrag(e);if(d?.type===z.dataset.drop)mutate(()=>{const j=week().jobs.find(x=>x.id===z.dataset.jobid);const arr=d.type==='staff'?(j.staffIds||(j.staffIds=[])):(j.vehicleIds||(j.vehicleIds=[]));if(!arr.includes(d.id))arr.push(d.id)})}});document.querySelectorAll('[data-remove-staff]').forEach(b=>b.onclick=()=>mutate(()=>{const j=week().jobs.find(x=>x.id===b.dataset.jobid);j.staffIds=(j.staffIds||[]).filter(x=>x!==b.dataset.removeStaff)}));document.querySelectorAll('[data-remove-vehicle]').forEach(b=>b.onclick=()=>mutate(()=>{const j=week().jobs.find(x=>x.id===b.dataset.jobid);j.vehicleIds=(j.vehicleIds||[]).filter(x=>x!==b.dataset.removeVehicle)}))}
function addInline(day,inp){const name=inp.value.trim();if(!name)return;mutate(()=>week().jobs.push({id:ids(),name,day,address:'',notes:'',color:'#2563eb',staffIds:[],vehicleIds:[],order:Date.now()}));inp.value=''}
function openJob(id){selectedJob=id;const j=week().jobs.find(x=>x.id===id);jobName.value=j.name;jobAddress.value=j.address||'';jobNotes.value=j.notes||'';jobColor.value=j.color||'#2563eb';jobModal.classList.add('open')}
function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'))}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);saveJob.onclick=()=>{const j=week().jobs.find(x=>x.id===selectedJob);if(!jobName.value.trim())return;mutate(()=>Object.assign(j,{name:jobName.value.trim(),address:jobAddress.value.trim(),notes:jobNotes.value.trim(),color:jobColor.value}));closeModals()};deleteJob.onclick=()=>{if(confirm('Delete this job?')){mutate(()=>week().jobs=week().jobs.filter(x=>x.id!==selectedJob));closeModals()}}
function openStaffManager(){staffRows.innerHTML=state.staff.map(s=>staffRow(s)).join('');staffModal.classList.add('open')}function staffRow(s){return `<div class="row" data-staff-row="${s.id}"><input value="${esc(s.name)}" data-name><select data-category>${state.staffCategories.map(c=>`<option value="${c.id}" ${c.id===s.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select data-status>${['Available','On Leave','Sick'].map(x=>`<option ${x===s.status?'selected':''}>${x}</option>`).join('')}</select><button class="btn danger small" data-delete-row>Delete</button></div>`}
manageStaff.onclick=openStaffManager;addStaff.onclick=()=>{const id=ids();staffRows.insertAdjacentHTML('beforeend',staffRow({id,name:'New Staff',categoryId:state.staffCategories[0]?.id,status:'Available'}))};addStaffCategory.onclick=()=>{const name=prompt('Category name');if(name)mutate(()=>state.staffCategories.push({id:ids(),name:name.trim()}));openStaffManager()};staffRows.onclick=e=>{if(e.target.matches('[data-delete-row]'))e.target.closest('.row').remove()};saveStaff.onclick=()=>{const rows=[...staffRows.querySelectorAll('[data-staff-row]')];mutate(()=>{state.staff=rows.map(r=>({id:r.dataset.staffRow,name:r.querySelector('[data-name]').value.trim()||'Unnamed Staff',categoryId:r.querySelector('[data-category]').value,status:r.querySelector('[data-status]').value}))});closeModals()}
function openVehicleManager(){vehicleRows.innerHTML=state.vehicles.map(v=>vehicleRow(v)).join('');vehicleModal.classList.add('open')}function vehicleRow(v){return `<div class="row" data-vehicle-row="${v.id}"><input value="${esc(v.name)}" data-name><select data-category>${state.vehicleCategories.map(c=>`<option value="${c.id}" ${c.id===v.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select><span></span><button class="btn danger small" data-delete-row>Delete</button></div>`}
manageVehicles.onclick=openVehicleManager;addVehicle.onclick=()=>{const id=ids();vehicleRows.insertAdjacentHTML('beforeend',vehicleRow({id,name:'New Vehicle',categoryId:state.vehicleCategories[0]?.id}))};addVehicleCategory.onclick=()=>{const name=prompt('Vehicle category name');if(name)mutate(()=>state.vehicleCategories.push({id:ids(),name:name.trim()}));openVehicleManager()};vehicleRows.onclick=e=>{if(e.target.matches('[data-delete-row]'))e.target.closest('.row').remove()};saveVehicles.onclick=()=>{const rows=[...vehicleRows.querySelectorAll('[data-vehicle-row]')];mutate(()=>{state.vehicles=rows.map(r=>({id:r.dataset.vehicleRow,name:r.querySelector('[data-name]').value.trim()||'Unnamed Vehicle',categoryId:r.querySelector('[data-category]').value}))});closeModals()}
prevWeek.onclick=()=>{weekStart.setDate(weekStart.getDate()-7);render()};nextWeek.onclick=()=>{weekStart.setDate(weekStart.getDate()+7);render()};todayWeek.onclick=()=>{weekStart=getMonday(new Date());render()};copyPrev.onclick=()=>{const p=new Date(weekStart);p.setDate(p.getDate()-7);const src=state.weeks[p.toISOString().slice(0,10)];if(!src)return toast('Previous week is empty');if(!confirm('Replace this week with a copy of the previous week?'))return;mutate(()=>state.weeks[key()]={jobs:src.jobs.map(j=>({...j,id:ids(),staffIds:[...(j.staffIds||[])],vehicleIds:[...(j.vehicleIds||[])]}))})};undoBtn.onclick=()=>{if(!history.length)return;future.push(JSON.stringify(state));state=JSON.parse(history.pop());saveLocal();scheduleSave();render()};redoBtn.onclick=()=>{if(!future.length)return;history.push(JSON.stringify(state));state=JSON.parse(future.pop());saveLocal();scheduleSave();render()};staffSearch.oninput=renderStaff;statusFilter.onchange=renderStaff;vehicleSearch.oninput=renderVehicles;
backupBtn.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`staff-scheduler-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};restoreBtn.onclick=()=>restoreFile.click();restoreFile.onchange=async()=>{try{const data=JSON.parse(await restoreFile.files[0].text());if(!data.staff||!data.weeks)throw new Error();mutate(()=>state=data);toast('Backup restored')}catch{alert('That backup file is not valid')}};
render();pullOnline(true);setInterval(()=>pullOnline(false),4000);
</script>
</body>
</html>
